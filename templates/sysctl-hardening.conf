# Debian 13 AI Server Template — Kernel Sysctl Hardening
# CIS Debian 13 Section 3.3 / NIST SI-11 (Error Handling)
#
# Deploy: sudo cp 90-hardening.conf /etc/sysctl.d/90-hardening.conf
# Apply: sudo sysctl --system
# Verify: sudo sysctl -a | grep -E 'dmesg_restrict|kptr_restrict|ptrace_scope'

# --- Kernel Information Leakage ---
# Restrict dmesg access to root (CIS 1.5.2)
kernel.dmesg_restrict = 1

# Hide kernel pointers from unprivileged users (CIS 1.5.3)
kernel.kptr_restrict = 2

# Restrict ptrace to parent processes only (CIS 1.5.4)
# NOTE: Requires Yama LSM. Uncomment if 'sysctl kernel.yama.ptrace_scope' works.
# kernel.yama.ptrace_scope = 2

# --- IPv6: DISABLED (CIS 3.3 / NIST SC-7) ---
# Template assumes an IPv4-only LAN profile. If IPv6 is required, adjust firewall and hardening accordingly.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 1

# --- Network Hardening ---
# Disable ICMP redirects — we are not a router (CIS 3.3.2)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Disable IPv6 Router Advertisements (CIS 3.3.9 / F8 audit)
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# Disable sending ICMP redirects (CIS 3.3.1)
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Log martian packets (CIS 3.3.4)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Ignore ICMP broadcast requests (CIS 3.3.5)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP error responses (CIS 3.3.6)
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Enable TCP SYN cookies (already enabled, ensure persistence) (CIS 3.3.8)
net.ipv4.tcp_syncookies = 1

# Disable source routing (CIS 3.3.3)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Enable reverse path filtering (CIS 3.3.7)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Disable secure redirects (CIS 3.3.3) — host is not a router
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# Disable IP forwarding — not a router (CIS 3.3.1)
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# --- Memory Protection ---
# ASLR already enabled (value 2), ensure persistence
kernel.randomize_va_space = 2

# Restrict core dumps
fs.suid_dumpable = 0

# Protect FIFOs and regular files in world-writable sticky dirs (CIS 1.5.4)
fs.protected_fifos = 2
fs.protected_regular = 2
