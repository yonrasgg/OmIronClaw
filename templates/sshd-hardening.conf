# Debian 13 AI Server Template — SSH Hardening Configuration
# CIS Debian 13 Section 5.2 / NIST AC-17 (Remote Access)
#
# Deploy: sudo cp 10-hardening.conf /etc/ssh/sshd_config.d/10-hardening.conf
# Validate: sudo sshd -t
# Apply: sudo systemctl reload sshd
#
# WARNING: Ensure your SSH key is deployed BEFORE applying this.
#          Test with a SECOND terminal before closing your session.
#
# COMPATIBILITY: VS Code Remote-SSH requires AllowTcpForwarding=yes.
#                Disabling it will lock out VS Code sessions.
#                See: wiki/phases/phase-1-foundation-security/evidence/
#
# INCIDENT-2026-04-17: AllowTcpForwarding=no caused VS Code lockout.
#                      Resolved by setting AllowTcpForwarding=yes.

# --- Authentication ---
# Key-only auth — ED25519 key required, password disabled
# Enforced since 2026-04-17 (Phase 3 final audit)
PasswordAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
PermitEmptyPasswords no
MaxAuthTries 3
MaxSessions 3
AuthenticationMethods publickey
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no

# Disable PerSourcePenalties — OpenSSH 10.0 default bans IPs after crashes
PerSourcePenalties no

# --- Access Control ---
AllowUsers ${SSH_USER}
# Add more users separated by space: AllowUsers ${SSH_USER} admin

# --- Protocol Hardening ---
X11Forwarding no
# AllowTcpForwarding MUST be 'yes' for VS Code Remote-SSH tunnels (CIS 5.2.21 exception)
# Risk-accepted: Required for admin tooling. Mitigated by AllowUsers + nftables LAN-only.
AllowTcpForwarding yes
AllowAgentForwarding no
PermitTunnel no
GatewayPorts no

# --- Session ---
ClientAliveInterval 300
ClientAliveCountMax 2
# LoginGraceTime 60s: allows VS Code Remote-SSH handshake over WiFi (CIS 5.2.17)
LoginGraceTime 60

# --- Logging ---
LogLevel VERBOSE

# --- Banner ---
Banner /etc/issue.net
DebianBanner no

# --- Cryptographic Policy (CIS 5.2.15 / F5+F9 audit 2026-04-17) ---
# Restrict MACs to ETM variants only — drop hmac-sha1 and non-ETM
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
# Restrict KexAlgorithms to strong curves
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
# Restrict Ciphers — AEAD-only, drop CTR modes (Phase 5 / NIST SC-8)
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
