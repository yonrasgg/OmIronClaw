# LAN Server — Module Blacklist (CIS 1.1.1 / NIST CM-7)
# Generic headless server profile
# Blacklists unused FS modules + Bluetooth (no BT hardware on server)

# Filesystem modules — no legitimate use
blacklist cramfs
blacklist freevxfs
blacklist jffs2
blacklist hfs
blacklist hfsplus
blacklist udf

# Bluetooth modules — headless server, no BT needed
blacklist bluetooth
blacklist btusb
blacklist btbcm
blacklist hci_uart

# Prevent auto-loading
install cramfs /bin/false
install freevxfs /bin/false
install jffs2 /bin/false
install hfs /bin/false
install hfsplus /bin/false
install udf /bin/false
install bluetooth /bin/false
