# Debian 13 AI Server Template — Ollama Systemd Hardening Override
# NIST AC-6 (Least Privilege) / NIST SA-8 (Security Engineering Principles)
#
# Deploy:
#   sudo mkdir -p /etc/systemd/system/ollama.service.d/
#   sudo cp ollama-override.conf /etc/systemd/system/ollama.service.d/override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart ollama
#
# Verify:
#   systemd-analyze security ollama.service
#   Target score: < 4.0 (OK)

[Service]
# --- Service Identity ---
User=ollama
Group=ollama

# --- Resource Limits ---
# Max 12GB RAM for AI workloads (leave 4GB for OS)
MemoryMax=12G
MemoryHigh=11G

# CPU allocation (use all 4 cores but allow system breathing room)
CPUQuota=350%

# --- Environment ---
# OLLAMA_MODELS lives on SD (/srv/ollama/models) — NOT the HDD.
# HDD is reserved for /mnt/data/ai-data (cold corpus, read-only to ollama).
EnvironmentFile=/etc/ollama.env
Environment="OLLAMA_HOST=127.0.0.1:11434"
Environment="OLLAMA_MODELS=/srv/ollama/models"
Environment="OLLAMA_KEEP_ALIVE=24h"
Environment="OLLAMA_NUM_PARALLEL=2"
Environment="OLLAMA_MAX_LOADED_MODELS=1"

# --- Sandboxing ---
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
ReadWritePaths=/srv/ollama
# AI corpus on HDD (documents, datasets, media) — read-only for inference
ReadOnlyPaths=/mnt/data/ai-data
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=no
SystemCallArchitectures=native

# --- Network ---
# Ollama needs network for API; restrict to inet only
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX

# --- Filesystem ---
PrivateDevices=yes
TemporaryFileSystem=/tmp

# --- Logging ---
StandardOutput=journal
StandardError=journal
SyslogIdentifier=ollama
