# Phase 5: WireGuard placeholder — NOT ACTIVE
# Deploy:
#   sudo cp wireguard-wg0.conf /etc/wireguard/wg0.conf
#   sudo chmod 600 /etc/wireguard/wg0.conf
#
# Activate (after configuring peer):
#   1. Uncomment Address and Peer section below
#   2. Uncomment nftables UDP 51820 rule: sudo sed -i 's/# udp dport 51820/udp dport 51820/' /etc/nftables.conf
#   3. sudo nft -f /etc/nftables.conf
#   4. sudo systemctl enable --now wg-quick@wg0

[Interface]
# PrivateKey loaded from file for security
PostUp = wg set %i private-key /etc/wireguard/private.key
# Address = 10.0.0.X/24  # Set when configuring peer
ListenPort = 51820

# [Peer]
# PublicKey = <peer-public-key>
# AllowedIPs = 10.0.0.0/24
# Endpoint = <peer-ip>:51820
