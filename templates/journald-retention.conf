# Phase 6: journald persistent storage + retention limits
# CIS 4.2.1 / NIST AU-3 (Content of Audit Records)
#
# Rationale: Ensure logs survive reboot and don't fill microSD.
# Template baseline: 500M is a conservative default for most hosts and can be adjusted.
#
# Deploy:
#   sudo mkdir -p /etc/systemd/journald.conf.d/
#   sudo cp <this-file> /etc/systemd/journald.conf.d/retention.conf
#   sudo systemctl restart systemd-journald
#
# Verify:
#   journalctl --disk-usage
#   journalctl --verify
#
# Rollback:
#   sudo rm /etc/systemd/journald.conf.d/retention.conf
#   sudo systemctl restart systemd-journald
#
# Phase 6 — T6.2 — 2026-04-17

[Journal]
# Store logs on disk (survive reboot) — CIS 4.2.1.1
Storage=persistent

# Cap total journal size — microSD budget-conscious
SystemMaxUse=500M

# Cap per-file size for rotation
SystemMaxFileSize=50M

# Keep 90 days max — sufficient for audit trail
MaxRetentionSec=90day

# Compress logs to save SD writes
Compress=yes

# Rate limit per-service to prevent log flooding
RateLimitIntervalSec=30s
RateLimitBurst=10000

# Forward to syslog: no (journald is primary)
ForwardToSyslog=no
