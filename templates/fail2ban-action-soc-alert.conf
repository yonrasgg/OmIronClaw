[Definition]
# Fail2ban action — forward ban events to Clawbot SOC webhook.
# Place at /etc/fail2ban/action.d/soc-alert.conf and reference from jail.local:
#
#   [sshd]
#   enabled = true
#   action  = %(action_mwl)s
#             soc-alert[severity=medium]

actionstart =
actionstop  =
actioncheck =

actionban   = /usr/local/sbin/soc-alert.sh \
                fail2ban <severity> <name>-ban <ip> <fq-hostname> \
                "Fail2ban banned <ip> on jail <name> after <failures> failures"

actionunban = /usr/local/sbin/soc-alert.sh \
                fail2ban info <name>-unban <ip> <fq-hostname> \
                "Fail2ban unbanned <ip> on jail <name>"

[Init]
severity = medium
name     = default
