# Phase 2: CIS 1.1.1 — Blacklist unnecessary filesystem and wireless modules
# NIST SP 800-53: CM-7 — Least Functionality
# Deploy: sudo cp <this-file> /etc/modprobe.d/hardening-blacklist.conf
#
# Phase 2 — T2.5 — 2026-04-16

# Filesystem modules — no legitimate use on headless AI server
blacklist cramfs
blacklist freevxfs
blacklist jffs2
blacklist hfs
blacklist hfsplus
blacklist udf

# Bluetooth modules — service already masked
blacklist bluetooth
blacklist btusb
blacklist btbcm
blacklist hci_uart

# Prevent auto-loading
install cramfs /bin/false
install freevxfs /bin/false
install jffs2 /bin/false
install hfs /bin/false
install hfsplus /bin/false
install udf /bin/false
install bluetooth /bin/false
