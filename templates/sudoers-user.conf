# Phase 2: Targeted sudo for ${SSH_USER} — NIST AC-6 / CIS 5.3
# Principle of Least Privilege — specific NOPASSWD + password-required fallback
# Deploy: sudo visudo -c -f <this-file> && sudo cp <this-file> /etc/sudoers.d/020_${SSH_USER}
#
# Phase 2 — T2.9 — 2026-04-16

# Service management (start/stop/restart/status AI services)
${SSH_USER} ALL=(root) NOPASSWD: /usr/bin/systemctl start ollama.service, \
                             /usr/bin/systemctl stop ollama.service, \
                             /usr/bin/systemctl restart ollama.service, \
                             /usr/bin/systemctl status ollama.service, \
                             /usr/bin/systemctl start openclaw.service, \
                             /usr/bin/systemctl stop openclaw.service, \
                             /usr/bin/systemctl restart openclaw.service, \
                             /usr/bin/systemctl status openclaw.service

# System maintenance (requires password)
${SSH_USER} ALL=(root) /usr/bin/apt update, \
                   /usr/bin/apt upgrade -y, \
                   /usr/bin/journalctl -u *, \
                   /usr/sbin/nft list ruleset, \
                   /usr/bin/systemctl daemon-reload, \
                   /usr/sbin/reboot, \
                   /usr/sbin/shutdown -h now

# Full admin fallback (with password, logged)
${SSH_USER} ALL=(ALL:ALL) ALL
