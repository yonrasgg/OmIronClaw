# Phase 5: Sudo session logging — CIS 5.3 / NIST AU-2
# Records all sudo commands, input, and output for audit trail
# Modified: 2026-04-17
#
# Deploy:
#   sudo cp sudoers-logging.conf /etc/sudoers.d/020_logging
#   sudo chmod 440 /etc/sudoers.d/020_logging
#   sudo visudo -c
#
# Prerequisite:
#   sudo mkdir -p /var/log/sudo-io && sudo chmod 700 /var/log/sudo-io

Defaults logfile="/var/log/sudo.log"
Defaults log_input, log_output
Defaults iolog_dir="/var/log/sudo-io"
Defaults!/usr/bin/sudoreplay !log_input, !log_output
