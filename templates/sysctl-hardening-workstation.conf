# LAN Workstation — Kernel Sysctl Hardening (Desktop/Admin-safe)
# Generic baseline profile (CIS 3.3 / NIST SI-11)
#
# IMPORTANT: ip_forward STAYS ENABLED for Docker/KVM/tethering.
#            IPv6 policy should be managed separately based on environment.
#            Desktop-friendly: no aggressive lockdowns that break GUI apps.
#
# Deploy: /etc/sysctl.d/90-hardening.conf
# Apply: sysctl --system

# --- Kernel Information Leakage ---
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2

# --- Network Hardening ---
# ICMP redirects — disabled (CIS 3.3.2)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0

# Sending redirects — disabled (CIS 3.3.1)
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Log martian packets (CIS 3.3.4)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Ignore ICMP broadcast requests (CIS 3.3.5)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP error responses (CIS 3.3.6)
net.ipv4.icmp_ignore_bogus_error_responses = 1

# TCP SYN cookies (CIS 3.3.8)
net.ipv4.tcp_syncookies = 1

# Disable source routing (CIS 3.3.3)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Reverse path filtering (CIS 3.3.7)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Disable secure redirects (CIS 3.3.3)
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# --- IP Forwarding: ENABLED (Docker + KVM + tethering) ---
# DO NOT SET net.ipv4.ip_forward here — preserve system default

# --- Memory Protection ---
kernel.randomize_va_space = 2
fs.suid_dumpable = 0
fs.protected_fifos = 2
fs.protected_regular = 2
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
