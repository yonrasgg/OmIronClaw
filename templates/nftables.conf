# Debian 13 AI Server Template — nftables firewall ruleset
# Phase 8 synced with deployed /etc/nftables.conf (2026-04-18)
# CIS 3.5 / NIST SC-7 (Boundary Protection)
#
# Deploy:
#   sudo cp nftables.conf /etc/nftables.conf
#   sudo nft -c -f /etc/nftables.conf   # dry-run syntax check
#   sudo systemctl restart nftables
#
# Verify:
#   sudo nft list ruleset

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		# Stateful tracking
		ct state established,related accept
		ct state invalid drop

		# Loopback
		iifname "lo" accept

		# ICMP (IPv4 only — IPv6 disabled at kernel)
		ip protocol icmp icmp type echo-request limit rate 5/second burst 5 packets accept

		# Caddy reverse proxy — LAN only (NIST SC-7)
		tcp dport 443 ip saddr ${LAN_SUBNET} ct state new accept
		tcp dport 80 ip saddr ${LAN_SUBNET} ct state new accept

		# SSH — LAN + USB tethering, rate-limited (CIS 5.2 / NIST AC-17)
		tcp dport 22 ip saddr { ${USB_TETHER_SUBNET}, ${LAN_SUBNET} } ct state new limit rate 10/minute burst 5 packets accept

		# mDNS — LAN only (multicast not tracked by conntrack)
		udp dport 5353 ip saddr ${LAN_SUBNET} accept

		# WireGuard — activate when tunnel configured (NIST SC-8)
		# udp dport 51820 ip saddr ${LAN_SUBNET} ct state new accept

		# Log dropped packets (rate-limited to avoid log flood)
		limit rate 5/minute burst 5 packets log prefix "[nftables-DROP-IN] "
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;

		# Stateful tracking
		ct state established,related accept

		# Loopback
		oifname "lo" accept

		# DNS (cleartext fallback + DoT)
		tcp dport 53 accept
		udp dport 53 accept

		# NTP
		udp dport 123 accept

		# HTTP/HTTPS (package updates, OCSP)
		tcp dport { 80, 443 } accept

		# DNS-over-TLS (NIST SC-8)
		tcp dport 853 accept

		# Phase 8: LAN egress restrictions (NIST SC-7 / AC-6)
		# SSH outbound — port 22 (audit host)
		tcp dport 22 ip daddr ${KALI_IP} accept
		# SSH outbound — port 2222 (managed LAN hosts)
		tcp dport 2222 ip daddr { ${LAB_IP}, ${COMPUTE_IP}, ${ADMIN_PC_IP} } accept

		# Block outbound to IoT devices (no management interface)
		ip daddr ${IOT_BLOCK_IP} drop comment "block echo/IoT"

		# Log + drop SSH to unauthorized LAN hosts (rate-limited)
		ip daddr ${LAN_SUBNET} tcp dport { 22, 2222 } limit rate 5/minute burst 5 packets log prefix "[nftables-DROP-EGRESS-SSH] "
		ip daddr ${LAN_SUBNET} tcp dport { 22, 2222 } drop comment "deny SSH to unauthorized LAN hosts"
	}
}
