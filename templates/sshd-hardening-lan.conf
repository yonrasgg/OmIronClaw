# LAN Host — SSH Hardening Configuration
# Generic LAN profile (CIS 5.2 / NIST AC-17)
#
# Deploy: /etc/ssh/sshd_config.d/10-hardening.conf
# Validate: sshd -t
# Apply: systemctl reload ssh (or restart ssh.socket)
#
# WARNING: Ensure SSH key is deployed BEFORE applying this.
#          Test with a SECOND terminal before closing your session.
#
# NOTE: Port is NOT set here — preserved from main sshd_config or ssh.socket.
# NOTE: AllowUsers is NOT set here — each host has different users.

# --- Authentication ---
PasswordAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
PermitEmptyPasswords no
MaxAuthTries 3
MaxSessions 5
AuthenticationMethods publickey
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no

# --- Protocol Hardening ---
X11Forwarding no
# AllowTcpForwarding MUST be 'yes' for VS Code Remote-SSH tunnels
AllowTcpForwarding yes
AllowAgentForwarding no
PermitTunnel no
GatewayPorts no

# --- Session ---
ClientAliveInterval 300
ClientAliveCountMax 2
LoginGraceTime 60

# --- Logging ---
LogLevel VERBOSE

# --- Banner ---
DebianBanner no

# --- Cryptographic Policy (CIS 5.2.15 / NIST SC-8) ---
# AEAD-only ciphers — no CTR modes
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
# ETM-only MACs
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
# Strong KEX only
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
