# Debian 13 AI Server Template — Caddy Systemd Hardening Override
# NIST AC-6 (Least Privilege) / CIS 1.1
#
# Deploy:
#   sudo mkdir -p /etc/systemd/system/caddy.service.d/
#   sudo cp caddy-override.conf /etc/systemd/system/caddy.service.d/override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart caddy
#
# Verify:
#   systemd-analyze security caddy.service
#   Target score: < 5.0 (OK)

[Service]
# --- Runtime ---
RuntimeDirectory=caddy

# --- Sandboxing ---
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
ReadWritePaths=/var/lib/caddy /var/log/caddy /run/caddy
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native

# --- Network ---
RestrictAddressFamilies=AF_INET AF_UNIX

# --- Capabilities ---
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE

# --- Filesystem ---
PrivateDevices=yes
TemporaryFileSystem=/tmp

# --- Resource Limits ---
MemoryMax=256M
MemoryHigh=200M

# --- Logging ---
StandardOutput=journal
StandardError=journal
SyslogIdentifier=caddy
