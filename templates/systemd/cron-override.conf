[Service]
# Phase 2: Cron sandboxing — minimal attack surface for scheduled tasks
# NIST CM-6 / CIS 5.1
# Deploy: sudo mkdir -p /etc/systemd/system/cron.service.d/
#         sudo cp <this-file> /etc/systemd/system/cron.service.d/hardening.conf
#         sudo systemctl daemon-reload && sudo systemctl restart cron
#
# Phase 2 — T2.13 — 2026-04-16
ProtectSystem=strict
ProtectHome=read-only
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictRealtime=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
PrivateDevices=yes
ReadWritePaths=/var/spool/cron
