# OpenClaw drop-in — grant access to AI data corpus on HDD
# Path: /etc/systemd/system/openclaw.service.d/10-ai-data.conf
#
# Deploy:
#   sudo mkdir -p /etc/systemd/system/openclaw.service.d/
#   sudo cp openclaw-ai-data.conf /etc/systemd/system/openclaw.service.d/10-ai-data.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart openclaw

[Service]
# OpenClaw may write to the AI data corpus (user uploads, cache, indexing artifacts).
# Ollama accesses the same path read-only via its own override.
ReadWritePaths=/mnt/data/ai-data
