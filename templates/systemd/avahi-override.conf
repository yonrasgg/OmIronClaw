[Service]
# Phase 2: Avahi sandboxing — keeping for <PI_HOSTNAME>.local mDNS discovery
# NIST CM-6 / CIS 5.1
# Deploy: sudo mkdir -p /etc/systemd/system/avahi-daemon.service.d/
#         sudo cp <this-file> /etc/systemd/system/avahi-daemon.service.d/hardening.conf
#         sudo systemctl daemon-reload && sudo systemctl restart avahi-daemon
#
# Note: Avahi uses chroot internally, needs NoNewPrivileges=no
#
# Phase 2 — T2.12 — 2026-04-16
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictRealtime=yes
LockPersonality=yes
NoNewPrivileges=no
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
PrivateDevices=yes
ReadWritePaths=/run/avahi-daemon
