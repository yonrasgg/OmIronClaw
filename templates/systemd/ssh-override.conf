[Service]
# Phase 2: SSH systemd sandboxing — NIST CM-6 / CIS 5.2
#
# ARM64 CONSTRAINTS (template baseline):
#   INCIDENT-2026-04-17: MemoryDenyWriteExecute=yes crashes sshd during KEX.
#     OpenSSL needs W|X memory for crypto operations on ARM64.
#   INCIDENT-2026-04-18: ProtectSystem=strict + ProtectHome=read-only breaks
#     VS Code Remote-SSH — filesystem appears read-only in sshd namespace,
#     preventing writes to ~/.vscode-server/. PrivateDevices=yes hides
#     block device nodes, causing further I/O confusion.
#     Fix: Use ProtectSystem=full (not strict), remove ProtectHome.
#     Recovery technique: systemd-run --pipe --wait -- <cmd> to escape namespace.
#
# Accepted trade-off: systemd security score ~4.5 instead of 6.2.
# VS Code Remote-SSH compatibility is non-negotiable for admin tooling.
#
# Phase 2 — T2.11 — 2026-04-16 (fixed 2026-04-17, 2026-04-18)
ProtectSystem=full
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
NoNewPrivileges=no
MemoryDenyWriteExecute=no
SystemCallArchitectures=native
