# LAN Workstation — Module Blacklist (CIS 1.1.1 / NIST CM-7)
# Generic desktop-friendly profile
# Only blacklists unused FS modules — keeps Bluetooth, USB audio, etc.

# Filesystem modules — no legitimate use on modern systems
blacklist cramfs
blacklist freevxfs
blacklist jffs2
blacklist hfs
blacklist hfsplus
blacklist udf

# Prevent auto-loading
install cramfs /bin/false
install freevxfs /bin/false
install jffs2 /bin/false
install hfs /bin/false
install hfsplus /bin/false
install udf /bin/false
